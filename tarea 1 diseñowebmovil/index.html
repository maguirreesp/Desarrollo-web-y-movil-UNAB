<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diseño Responsivo</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- HEADER/NAVEGACIÓN -->
    <header>
        <div class="container"> <!--Container que centra y limita ancho -->
            <div class="row"> <!--Fila que contiene columnas -->
                <div class="col-12"> <!--Columna que ocupa todo el ancho, 12 de 12-->
                    <nav>
                        <ul>
                            <li><a href="#home">Inicio</a></li>
                            <li><a href="#about">Acerca de</a></li>
                            <li><a href="#services">Servicios</a></li>
                            <li><a href="#contact">Contacto</a></li>
                        </ul>
                    </nav>
                </div>
            </div>
        </div>
    </header>

    <!-- HERO -->
    <section class="hero">
        <div class="container">
            <div class="row">
                <div class="col-12"> 
                    <h1>PR 1</h1>
                </div>
            </div>
        </div>
    </section>

    <!-- 3 TARJETAS CON DIFERENTES TAMAÑOS -->
    <section class="servicios">
        <div class="container">
            <div class="row">
                <div class="col-4">Tarjeta 1</div> <!-- 4 + 4 + 4 = 12, ocupando todo el ancho -->
                <div class="col-4">Tarjeta 2</div>
                <div class="col-4">Tarjeta 3</div>
            </div>
        </div>
    </section>

    <!-- FOOTER -->
    <footer>
        <div class="container">
            <div class="row">
                <div class="col-12">Maureen Aguirre E.</div>
            </div>
        </div>
    </footer>
</body>
</html>
